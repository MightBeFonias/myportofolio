<div class="card-actions__delete">
    <button type="button"
            class="button collection-action delete-action"
            popovertarget="delete-award-{{ award.id }}"
            aria-label="Delete {{ award.title }}"
            title="Delete Award">
        Delete Award
    </button>
</div>
<div id="delete-award-{{ award.id }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-award-title-{{ award.id }}">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-award-{{ award.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-award-{{ award.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-award-title-{{ award.id }}">?</h2>
        <p>
            Are you sure wanna delete 
            <strong>{{ award.title }}</strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-award-{{ award.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_award' award.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
